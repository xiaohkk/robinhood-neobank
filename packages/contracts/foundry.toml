[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com/rpc"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

# Blockscout verification for Robinhood Chain. Blockscout ignores the API key (any non-empty value
# works); pass `--verifier blockscout` to forge verify-contract. See docs/ROBINHOOD-DEPLOY.md.
[etherscan]
robinhood_testnet = {key = "blockscout", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630}
robinhood_mainnet = {key = "blockscout", url = "https://robinhoodchain.blockscout.com/api", chain = 4663}
